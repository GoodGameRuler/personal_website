<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .petal { display: none; }
    .dot { display: block; }
    @media (prefers-color-scheme: light) {
      .petal { display: block; }
      .dot { display: none; }
    }
  </style>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c4a7e7" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#c4a7e7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#c4a7e7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#e8ddfb"/>
      <stop offset="1" stop-color="#c4a7e7"/>
    </radialGradient>
    <linearGradient id="petalFill" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f0619b"/>
      <stop offset="0.55" stop-color="#e8377c"/>
      <stop offset="1" stop-color="#c22a63"/>
    </linearGradient>
  </defs>

  <!-- dark scheme: the tracer's shining head -->
  <g class="dot">
    <circle cx="32" cy="32" r="30" fill="url(#glow)"/>
    <circle cx="32" cy="32" r="14" fill="url(#core)"/>
  </g>

  <!-- light scheme: a single senbonzakura petal -->
  <g class="petal" transform="rotate(24 32 32)">
    <path d="M32 5 C 46 14, 53 34, 33 59 C 32.4 59.7, 31.6 59.7, 31 59 C 11 34, 18 14, 32 5 Z"
          fill="url(#petalFill)"/>
    <path d="M32 14 C 33.5 28, 33.5 42, 32 53" stroke="#f6afc9" stroke-width="2.4"
          stroke-linecap="round" fill="none" opacity="0.85"/>
  </g>
</svg>
